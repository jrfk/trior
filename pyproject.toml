[build-system]
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "trior"
version = "0.1.0"
description = "Experimental Rust-powered structured concurrency runtime for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE.Trio"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
test = ["trio==0.35.0", "pytest>=9,<10"]

[project.urls]
Repository = "https://github.com/jrfk/trior"

[tool.maturin]
python-source = "python"
module-name = "trior._native"
python-packages = ["trior"]

[tool.pytest.ini_options]
testpaths = ["tests"]

