name: Python distributions

on:
  pull_request:
    paths:
      - .github/workflows/python-release.yml
      - Cargo.*
      - pyproject.toml
      - README.md
      - LICENSE*
      - requirements-dev.lock
      - python/**
      - src/**
      - tests/**
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish to TestPyPI after verifying the distributions
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            manylinux: '2014'
          - os: macos-latest
            platform: macos-arm64
            manylinux: 'off'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --interpreter python3.12 --out dist
      - name: Test the installed wheel
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements-dev.lock dist/*.whl
          .venv/bin/python -m pytest -q
          TRIOR_REACTOR=poll .venv/bin/python -m pytest -q
      - name: Build the source distribution
        if: runner.os == 'Linux'
        run: .venv/bin/maturin sdist --out dist
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  check-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_testpypi && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if not Path("LICENSE").is_file() or not project.get("license"):
              raise SystemExit("Select and declare Trior's license before publishing.")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              expected = "v" + project["version"]
              if os.environ["GITHUB_REF_NAME"] != expected:
                  raise SystemExit(f"Expected release tag {expected}")
          PY

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi && github.ref == 'refs/heads/main'
    needs: [build, check-release]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/trior
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, check-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trior
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
