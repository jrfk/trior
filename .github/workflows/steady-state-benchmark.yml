name: Steady-state benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  steady-state:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: rustup toolchain install stable --profile minimal
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python -r requirements-dev.lock
      - name: Build Trior
        run: |
          source .venv/bin/activate
          maturin develop --release --locked
      - name: Measure 600 workers
        timeout-minutes: 35
        run: |
          .venv/bin/python benchmarks/bench_steady_state.py compare \
            --output "$RUNNER_TEMP/steady-state.json"
      - name: Save trial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steady-state
          path: ${{ runner.temp }}/steady-state.json
          if-no-files-found: ignore
